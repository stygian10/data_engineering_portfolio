apiVersion: apps/v1
kind: Deployment

metadata:
  name: prediction-dashboard-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: prediction-dashboard

  template:
    metadata:
      labels:
        app: prediction-dashboard

    spec:
      containers:
        - name: prediction-dashboard

          image: data_engineering_portfolio-fastapi:latest
          imagePullPolicy: Never

          workingDir: /app

          command:
            - python
            - -m
            - dashboard.app

          ports:
            - containerPort: 8051

          env:
            - name: PYTHONUNBUFFERED
              value: "1"

            - name: FASTAPI_URL
              value: "http://fastapi-service:8000"

            - name: MODEL_PATH
              value: "/app/model_artifacts/linear_regression_model.pkl"

            - name: SCALER_PATH
              value: "/app/model_artifacts/scaler.pkl"

            - name: MODEL_METRICS_PATH
              value: "/app/model_artifacts/model_metrics.json"

            - name: FEATURE_FILE
              value: "/app/data/w7_features_final.parquet"

            - name: PREDICTION_FILE
              value: "/app/data/weather_predictions.csv"

          volumeMounts:
            - name: model-artifacts
              mountPath: /app/model_artifacts
              readOnly: true

            - name: feature-data
              mountPath: /app/data/w7_features_final.parquet
              readOnly: true

            - name: prediction-data
              mountPath: /app/data/weather_predictions.csv
              readOnly: true

          readinessProbe:
            httpGet:
              path: /
              port: 8051
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 8051
            initialDelaySeconds: 20
            periodSeconds: 20

      volumes:
        - name: model-artifacts
          hostPath:
            path: /Users/gaurav/Documents/Projects/data_engineering_portfolio/w8_weather_prediction_model/models
            type: Directory

        - name: feature-data
          hostPath:
            path: /Users/gaurav/Documents/Projects/data_engineering_portfolio/w7_feature_engineering/data/processed/w7_features_final.parquet
            type: File

        - name: prediction-data
          hostPath:
            path: /Users/gaurav/Documents/Projects/data_engineering_portfolio/w9_ml_pipeline/data/predictions/weather_predictions.csv
            type: File