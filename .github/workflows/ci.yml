name: Weather Intelligence Platform CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  ci:
    
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Python
        run: python --version

      - name: Install limited test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas requests scikit-learn joblib

      - name: Verify repository structure
        run: |
          test -f Dockerfile
          test -d k8
          test -d orchestration
          test -d dags
          test -d w10_fastapi_service

      - name: Run limited tests
        run: python -m unittest tests/test_project_imports.py

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-platform image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: CI validation successful
        run: echo "P2-W4-D4 CI validation completed successfully"

      - name: Image publishing completed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "P2-W4 container image published successfully"

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Deploy application workloads to Oracle K3s
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_k3s_key
          chmod 600 ~/.ssh/oracle_k3s_key

          ssh \
            -i ~/.ssh/oracle_k3s_key \
            -o StrictHostKeyChecking=no \
            "$ORACLE_USER@$ORACLE_HOST" \
            "
              set -e

              IMAGE=ghcr.io/gaurav-dwivedi-de/data_engineering_portfolio:${IMAGE_TAG}

              echo 'Deploying application image:'
              echo \$IMAGE

              deployments=(
                'prediction-dashboard-deployment'
                'fastapi-deployment'
                'airflow-apiserver'
                'airflow-scheduler'
                'airflow-dag-processor'
              )

              for deployment in \${deployments[@]}; do
                echo \"Updating \$deployment...\"

                sudo k3s kubectl set image \
                  deployment/\$deployment \
                  \"\$(sudo k3s kubectl get deployment \$deployment -o jsonpath='{.spec.template.spec.containers[0].name}')=\$IMAGE\"

                sudo k3s kubectl rollout status \
                  deployment/\$deployment \
                  --timeout=180s
              done

              echo 'All application deployments rolled out successfully.'
            "