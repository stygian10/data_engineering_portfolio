apiVersion: batch/v1
kind: Job
metadata:
  name: airflow-init
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: airflow-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: airflow-init
          image: ghcr.io/gaurav-dwivedi-de/data_engineering_portfolio:INIT_IMAGE_TAG
          imagePullPolicy: IfNotPresent

          envFrom:
            - secretRef:
                name: weather-env

          env:
            - name: AIRFLOW__CORE__EXECUTOR
              value: "LocalExecutor"

            - name: AIRFLOW__CORE__AUTH_MANAGER
              value: "airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager"

            - name: AIRFLOW__CORE__LOAD_EXAMPLES
              value: "false"

            - name: AIRFLOW__CORE__FERNET_KEY
              value: ""

            - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
              value: "true"

            - name: AIRFLOW__API_AUTH__JWT_SECRET
              value: "airflow_jwt_secret"

            - name: AIRFLOW__API_AUTH__JWT_ISSUER
              value: "airflow"

            - name: W2_DATA_FILE
              value: "/opt/airflow/w2/data/processed/weather_ready_for_postgres.csv"

            - name: W7_FEATURE_DATA_PATH
              value: "/opt/airflow/w7/data/processed/w7_features_final.parquet"

            - name: MINIO_ENDPOINT
              value: "weather-minio:9000"

            - name: PYTHONPATH
              value: "/opt/airflow"

          command:
            - /bin/bash
            - -c
            - |
              set -e

              export AIRFLOW__DATABASE__SQL_ALCHEMY_CONN="postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}"

              echo "Waiting for PostgreSQL..."

              until python -c '
              import os
              import psycopg2

              psycopg2.connect(
                  host=os.environ["POSTGRES_HOST"],
                  port=int(os.environ["POSTGRES_PORT"]),
                  dbname=os.environ["POSTGRES_DB"],
                  user=os.environ["POSTGRES_USER"],
                  password=os.environ["POSTGRES_PASSWORD"],
              ).close()
              '; do
                echo "PostgreSQL is not ready yet..."
                sleep 3
              done

              echo "PostgreSQL is ready."
              echo "Running Airflow database migration..."

              airflow db migrate

              echo "Creating Airflow admin user..."

              airflow users create \
                --username "${AIRFLOW_ADMIN_USERNAME}" \
                --firstname "Admin" \
                --lastname "User" \
                --role Admin \
                --email "admin@weather-platform.local" \
                --password "${AIRFLOW_ADMIN_PASSWORD}" || true

              echo "Airflow initialization completed."