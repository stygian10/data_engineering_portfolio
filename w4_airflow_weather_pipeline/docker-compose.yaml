version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    restart: always

  airflow-webserver:
    build: .
    image: airflow-custom:latest
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'

      MINIO_ENDPOINT: http://minio:9000
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./data:/opt/airflow/data
      - ../w5_spark_weather_etl:/opt/airflow/w5
      - ../w6_visualisation_dashboard:/opt/airflow/w6
      - ../w7_feature_engineering:/opt/airflow/w7
      - ../w8_weather_prediction_model:/opt/airflow/w8
      - ../w9_ml_pipeline:/opt/airflow/w9
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - minio
    command: >
      bash -c "
      airflow db upgrade &&
      airflow users create --username admin --firstname admin --lastname user --role Admin --email admin@email.com --password admin || true &&
      airflow webserver
      "

  airflow-scheduler:
    build: .
    image: airflow-custom:latest
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow

      MINIO_ENDPOINT: http://minio:9000
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./data:/opt/airflow/data
      - ../w5_spark_weather_etl:/opt/airflow/w5
      - ../w6_visualisation_dashboard:/opt/airflow/w6
      - ../w7_feature_engineering:/opt/airflow/w7
      - ../w8_weather_prediction_model:/opt/airflow/w8
      - ../w9_ml_pipeline:/opt/airflow/w9
    depends_on:
      - postgres
      - minio
    command: airflow scheduler

  dashboard:
    build: ../w6_visualisation_dashboard
    container_name: dashboard
    ports:
      - "8050:8050"
    volumes:
      - ../w6_visualisation_dashboard:/opt/airflow/w6
      - ./data:/opt/airflow/data 
    depends_on:
      - minio
    command: python /opt/airflow/w6/src/app.py

volumes:
  postgres-db-volume:
  minio-data: