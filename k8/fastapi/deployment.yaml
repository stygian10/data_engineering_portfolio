apiVersion: apps/v1
kind: Deployment

metadata:
  name: fastapi-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: fastapi

  template:
    metadata:
      labels:
        app: fastapi

    spec:

      # Download current files from S3 before FastAPI starts
      initContainers:

        - name: download-s3-artifacts

          image: public.ecr.aws/aws-cli/aws-cli:latest
          imagePullPolicy: IfNotPresent

          envFrom:
            - secretRef:
                name: weather-env

          command:
            - /bin/sh
            - -c

          args:
            - |
              set -e

              echo "Downloading model files..."

              aws s3 cp \
                "s3://${S3_BUCKET_NAME}/models/best_model.pkl" \
                "/app/model_artifacts/best_model.pkl"

              aws s3 cp \
                "s3://${S3_BUCKET_NAME}/models/scaler.pkl" \
                "/app/model_artifacts/scaler.pkl"

              aws s3 cp \
                "s3://${S3_BUCKET_NAME}/models/model_metrics.json" \
                "/app/model_artifacts/model_metrics.json"

              echo "Downloading W7 feature file..."

              aws s3 cp \
                "s3://${S3_BUCKET_NAME}/features/w7_features_final.parquet" \
                "/app/data/w7_features_final.parquet"

              echo "Downloading W9 prediction file..."

              aws s3 cp \
                "s3://${S3_BUCKET_NAME}/predictions/weather_predictions.csv" \
                "/app/data/weather_predictions.csv"

              echo "All S3 files downloaded successfully."

          volumeMounts:
            - name: model-artifacts
              mountPath: /app/model_artifacts

            - name: application-data
              mountPath: /app/data

      containers:

        - name: fastapi

          image: airflow-custom:latest
          imagePullPolicy: Never

          workingDir: /opt/airflow/w10

          command:
            - uvicorn
            - app.main:app
            - --host
            - "0.0.0.0"
            - --port
            - "8000"

          ports:
            - containerPort: 8000

          env:
            - name: PYTHONUNBUFFERED
              value: "1"

            - name: MODEL_PATH
              value: "/app/model_artifacts/best_model.pkl"

            - name: SCALER_PATH
              value: "/app/model_artifacts/scaler.pkl"

            - name: MODEL_METRICS_PATH
              value: "/app/model_artifacts/model_metrics.json"

            - name: FEATURE_FILE
              value: "/app/data/w7_features_final.parquet"

            - name: PREDICTION_FILE
              value: "/app/data/weather_predictions.csv"

          volumeMounts:
            - name: model-artifacts
              mountPath: /app/model_artifacts
              readOnly: true

            - name: application-data
              mountPath: /app/data
              readOnly: true

          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20

      volumes:

        - name: model-artifacts
          emptyDir: {}

        - name: application-data
          emptyDir: {}