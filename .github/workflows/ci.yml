name: Weather Intelligence Platform CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  changes:
    runs-on: ubuntu-latest

    outputs:
      deploy: ${{ steps.detect.outputs.deploy }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect deployable changes
        id: detect
        run: |
          deploy=false

          while IFS= read -r file; do
            case "$file" in

              # Docker / dependency configuration
              Dockerfile|docker_requirements.txt|requirements.txt)
                deploy=true
                ;;

              # Docker Compose configuration
              docker-compose.yml|docker-compose.resolved.yml)
                deploy=true
                ;;

              # Kubernetes configuration
              k8/*)
                deploy=true
                ;;

              # Any Python source file anywhere in the repository
              *.py)
                deploy=true
                ;;

            esac
          done < <(git diff --name-only HEAD^ HEAD)

          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "Deploy required: $deploy"

  ci:
    needs: changes

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Verify Python
        run: python --version

      - name: Install limited test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas requests scikit-learn joblib

      - name: Verify repository structure
        run: |
          test -f Dockerfile
          test -d k8
          test -d k8/postgres
          test -d k8/minio
          test -d orchestration
          test -d dags
          test -d w10_fastapi_service

      - name: Run limited tests
        run: python -m unittest tests/test_project_imports.py

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.deploy == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-platform image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.deploy == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: CI validation successful
        run: echo "P2-W4 CI validation completed successfully"

      - name: Image publishing completed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.deploy == 'true'
        run: echo "P2-W4 container image published successfully"

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.deploy == 'true'

    needs:
      - changes
      - ci

    runs-on: ubuntu-latest

    steps:
      - name: Deploy workloads to Oracle K3s
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          IMAGE_TAG: ${{ github.sha }}

        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_k3s_key
          chmod 600 ~/.ssh/oracle_k3s_key

          ssh \
            -i ~/.ssh/oracle_k3s_key \
            -o StrictHostKeyChecking=no \
            "$ORACLE_USER@$ORACLE_HOST" \
            "
              set -e

              REPO=/home/ubuntu/data_engineering_portfolio

              echo '========================================'
              echo 'Synchronizing repository from GitHub'
              echo '========================================'

              cd \$REPO

              git fetch origin main
              git reset --hard origin/main

              echo 'Repository synchronized with GitHub.'
              git log -1 --oneline

              echo '========================================'
              echo 'Checking Kubernetes Secret'
              echo '========================================'

              sudo k3s kubectl get secret weather-env >/dev/null

              echo 'weather-env Secret exists.'

              echo '========================================'
              echo '1. Deploying PostgreSQL'
              echo '========================================'

              sudo k3s kubectl apply \
                -f \$REPO/k8/postgres/pvc.yaml

              sudo k3s kubectl apply \
                -f \$REPO/k8/postgres/statefulset.yaml

              sudo k3s kubectl apply \
                -f \$REPO/k8/postgres/service.yaml

              sudo k3s kubectl rollout status \
                statefulset/postgres \
                --timeout=180s

              echo 'PostgreSQL is ready.'

              echo '========================================'
              echo '2. Deploying MinIO'
              echo '========================================'

              sudo k3s kubectl apply \
                -f \$REPO/k8/minio/pvc.yaml

              sudo k3s kubectl apply \
                -f \$REPO/k8/minio/statefulset.yaml

              sudo k3s kubectl apply \
                -f \$REPO/k8/minio/service.yaml

              sudo k3s kubectl rollout status \
                statefulset/weather-minio \
                --timeout=180s

              echo 'MinIO is ready.'

              echo '========================================'
              echo '3. Initializing Airflow'
              echo '========================================'

              sudo k3s kubectl delete job airflow-init \
                --ignore-not-found=true

              sed \"s|INIT_IMAGE_TAG|${IMAGE_TAG}|g\" \
                \$REPO/k8/airflow/airflow-init.yaml \
                | sudo k3s kubectl apply -f -

              sudo k3s kubectl wait \
                --for=condition=complete \
                job/airflow-init \
                --timeout=300s

              echo 'Airflow initialization completed.'

              echo '========================================'
              echo '4. Deploying Airflow'
              echo '========================================'

              sed \"s|IMAGE_TAG|${IMAGE_TAG}|g\" \
                \$REPO/k8/airflow/api-server.yaml \
                | sudo k3s kubectl apply -f -

              sed \"s|IMAGE_TAG|${IMAGE_TAG}|g\" \
                \$REPO/k8/airflow/scheduler.yaml \
                | sudo k3s kubectl apply -f -

              sed \"s|IMAGE_TAG|${IMAGE_TAG}|g\" \
                \$REPO/k8/airflow/dag-processor.yaml \
                | sudo k3s kubectl apply -f -

              sudo k3s kubectl rollout status \
                deployment/airflow-apiserver \
                --timeout=180s

              sudo k3s kubectl rollout status \
                deployment/airflow-scheduler \
                --timeout=180s

              sudo k3s kubectl rollout status \
                deployment/airflow-dag-processor \
                --timeout=180s

              echo 'Airflow workloads are ready.'

              echo '========================================'
              echo '5. Deploying FastAPI'
              echo '========================================'

              sed \"s|IMAGE_TAG|${IMAGE_TAG}|g\" \
                \$REPO/k8/fastapi/deployment.yaml \
                | sudo k3s kubectl apply -f -

              sudo k3s kubectl apply \
                -f \$REPO/k8/fastapi/service.yaml

              sudo k3s kubectl rollout status \
                deployment/fastapi-deployment \
                --timeout=180s

              echo 'FastAPI is ready.'

              echo '========================================'
              echo '6. Deploying Dashboard'
              echo '========================================'

              sed \"s|IMAGE_TAG|${IMAGE_TAG}|g\" \
                \$REPO/k8/dashboard/deployment.yaml \
                | sudo k3s kubectl apply -f -
              
              sudo k3s kubectl apply \
                -f \$REPO/k8/dashboard/service.yaml

              sudo k3s kubectl rollout status \
                deployment/prediction-dashboard-deployment \
                --timeout=180s
            
              echo 'Dashboard is ready.'

              echo '========================================'
              echo 'FINAL DEPLOYMENT STATUS'
              echo '========================================'

              sudo k3s kubectl get statefulsets
              sudo k3s kubectl get deployments
              sudo k3s kubectl get jobs
              sudo k3s kubectl get pods

              echo '========================================'
              echo 'DEPLOYED IMAGE'
              echo '========================================'

              sudo k3s kubectl get deployments \
                -o custom-columns='NAME:.metadata.name,IMAGE:.spec.template.spec.containers[0].image'

              echo '========================================'
              echo 'All workloads deployed successfully.'
              echo '========================================'
            "