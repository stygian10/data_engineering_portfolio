apiVersion: apps/v1
kind: Deployment

metadata:
  name: prediction-dashboard-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: prediction-dashboard

  template:
    metadata:
      labels:
        app: prediction-dashboard

    spec:

      # Download current artifacts from S3 before Dashboard starts
      initContainers:

        - name: download-s3-artifacts

          image: public.ecr.aws/aws-cli/aws-cli:latest
          imagePullPolicy: Never

          envFrom:
            - secretRef:
                name: weather-env

          command:
            - /bin/sh
            - -c

          args:
            - |
              set -e

              echo "Downloading W7 feature file..."

              aws s3 cp \
                "s3://${S3_BUCKET_NAME}/features/w7_features_final.parquet" \
                "/app/data/w7_features_final.parquet"

              echo "Downloading W9 prediction file..."

              aws s3 cp \
                "s3://${S3_BUCKET_NAME}/predictions/weather_predictions.csv" \
                "/app/data/weather_predictions.csv"

              echo "Downloading model metrics..."

              aws s3 cp \
                "s3://${S3_BUCKET_NAME}/models/model_metrics.json" \
                "/app/model_artifacts/model_metrics.json"

              echo "Downloading best model..."

              aws s3 cp \
                "s3://${S3_BUCKET_NAME}/models/best_model.pkl" \
                "/app/model_artifacts/best_model.pkl"

              echo "Downloading scaler..."

              aws s3 cp \
                "s3://${S3_BUCKET_NAME}/models/scaler.pkl" \
                "/app/model_artifacts/scaler.pkl"

              echo "All Dashboard S3 files downloaded successfully."

          volumeMounts:
            - name: application-data
              mountPath: /app/data

            - name: model-artifacts
              mountPath: /app/model_artifacts

      containers:

        - name: prediction-dashboard

          image: airflow-custom:latest
          imagePullPolicy: Never

          workingDir: /opt/airflow/w10

          command:
            - python
            - -m
            - dashboard.app

          ports:
            - containerPort: 8051

          env:
            - name: PYTHONUNBUFFERED
              value: "1"

            - name: FASTAPI_URL
              value: "http://fastapi-service:8000"

            - name: MODEL_PATH
              value: "/app/model_artifacts/best_model.pkl"

            - name: SCALER_PATH
              value: "/app/model_artifacts/scaler.pkl"

            - name: MODEL_METRICS_PATH
              value: "/app/model_artifacts/model_metrics.json"

            - name: FEATURE_FILE
              value: "/app/data/w7_features_final.parquet"

            - name: PREDICTION_FILE
              value: "/app/data/weather_predictions.csv"

          volumeMounts:
            - name: application-data
              mountPath: /app/data
              readOnly: true

            - name: model-artifacts
              mountPath: /app/model_artifacts
              readOnly: true

          readinessProbe:
            httpGet:
              path: /
              port: 8051
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 8051
            initialDelaySeconds: 20
            periodSeconds: 20

      volumes:

        - name: application-data
          emptyDir: {}

        - name: model-artifacts
          emptyDir: {}