name: Weather Intelligence Platform CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  ci:name: Weather Intelligence Platform CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Python
        run: python --version

      - name: Install limited test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas requests scikit-learn joblib

      - name: Verify repository structure
        run: |
          test -f Dockerfile
          test -d k8
          test -d orchestration
          test -d dags
          test -d w10_fastapi_service

      - name: Run limited tests
        run: python -m unittest tests/test_project_imports.py

      - name: CI validation successful
        run: echo "P2-W4-D2 validation passed"
