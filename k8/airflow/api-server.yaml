apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-apiserver
  labels:
    app: airflow-apiserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-apiserver
  template:
    metadata:
      labels:
        app: airflow-apiserver
    spec:
      containers:
        - name: airflow-apiserver
          image: airflow-custom:latest
          imagePullPolicy: IfNotPresent
          command:
            - airflow
            - api-server
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: weather-env
          env:
            - name: AIRFLOW__CORE__EXECUTOR
              value: "LocalExecutor"
            - name: AIRFLOW__CORE__AUTH_MANAGER
              value: "airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager"
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: "postgresql+psycopg2://airflow:airflow@postgres:5432/airflow"
            - name: AIRFLOW__CORE__EXECUTION_API_SERVER_URL
              value: "http://airflow-apiserver:8080/execution/"
            - name: AIRFLOW__CORE__LOAD_EXAMPLES
              value: "false"
            - name: AIRFLOW__CORE__FERNET_KEY
              value: ""
            - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
              value: "true"
            - name: AIRFLOW__API_AUTH__JWT_SECRET
              value: "airflow_jwt_secret"
            - name: AIRFLOW__API_AUTH__JWT_ISSUER
              value: "airflow"
            - name: AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK
              value: "true"
            - name: POSTGRES_HOST
              value: "postgres"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "airflow"
            - name: POSTGRES_USER
              value: "airflow"
            - name: POSTGRES_PASSWORD
              value: "airflow"
            - name: W2_DATA_FILE
              value: "/opt/airflow/w2/data/processed/weather_ready_for_postgres.csv"
            - name: W7_FEATURE_DATA_PATH
              value: "/opt/airflow/w7/data/processed/w7_features_final.parquet"
            - name: MINIO_ENDPOINT
              value: "weather-minio:9000"
            - name: PYTHONPATH
              value: "/opt/airflow"
          readinessProbe:
            httpGet:
              path: /api/v2/monitor/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/v2/monitor/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: airflow-apiserver
  labels:
    app: airflow-apiserver
spec:
  selector:
    app: airflow-apiserver
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
  type: NodePort
